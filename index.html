<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HVN Excel Data Viewer</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root{--red:#d71920;--ink:#1d2939;--muted:#667085;--line:#e4e7ec;--bg:#f6f7f9;--green:#067647}
    *{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:14px}
    .mark{width:34px;height:34px;border-radius:8px;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:800}.title{font-weight:700;font-size:18px}.sub{color:var(--muted);font-size:13px}
    main{max-width:1280px;margin:28px auto;padding:0 24px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(16,24,40,.04)}
    .upload{padding:28px}.drop{border:2px dashed #cfd4dc;border-radius:12px;padding:42px;text-align:center;cursor:pointer;transition:.2s}.drop.drag,.drop:hover{border-color:var(--red);background:#fff8f8}.drop h2{margin:10px 0 6px;font-size:19px}.drop p{margin:0;color:var(--muted)}
    button{border:0;border-radius:8px;padding:10px 16px;font-weight:650;cursor:pointer}.primary{background:var(--red);color:#fff;margin-top:18px}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}
    .error{display:none;margin-top:16px;padding:12px 14px;border-radius:8px;background:#fef3f2;color:#b42318}.summary{display:none;margin-top:20px;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:16px;border:1px solid var(--line);border-radius:10px}.metric b{display:block;font-size:23px;margin-top:4px}.metric span{color:var(--muted);font-size:13px}
    .result{display:none;margin-top:20px}.toolbar{padding:16px 18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:8px;padding:10px 12px}.toolbar .status{color:var(--green);font-size:13px;font-weight:650}
    .table-wrap{overflow:auto;max-height:570px}table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}th{position:sticky;top:0;background:#f9fafb;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}td{padding:11px 14px;border-bottom:1px solid #f0f1f3;white-space:nowrap}tbody tr:hover{background:#fffafa}.arrow{color:#98a2b3;margin-left:6px}.footer{padding:12px 18px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
    @media(max-width:720px){header{padding:0 16px}main{padding:0 12px}.summary{grid-template-columns:1fr 1fr}.upload{padding:18px}.drop{padding:28px 12px}}
  </style>
</head>
<body>
<header><div class="mark">H</div><div><div class="title">Excel Data Viewer</div><div class="sub">Chuẩn hóa dữ liệu container trực tiếp trên trình duyệt</div></div></header>
<main>
  <section class="card upload">
    <div id="drop" class="drop">
      <div style="font-size:36px">⇧</div><h2>Kéo thả file Excel vào đây</h2>
      <p>Chấp nhận file .xlsx, tên file bất kỳ</p>
      <button class="primary" id="pick">Chọn file</button><input id="file" type="file" accept=".xlsx" hidden>
    </div>
    <div id="error" class="error"></div>
    <div id="summary" class="summary">
      <div class="metric"><span>Tên file</span><b id="mFile" style="font-size:15px;overflow:hidden;text-overflow:ellipsis"></b></div>
      <div class="metric"><span>Dòng dữ liệu gốc</span><b id="mOriginal">0</b></div>
      <div class="metric"><span>Dòng trùng đã bỏ</span><b id="mDup">0</b></div>
      <div class="metric"><span>Dòng kết quả</span><b id="mFinal">0</b></div>
    </div>
  </section>
  <section id="result" class="card result">
    <div class="toolbar"><input id="search" placeholder="Tìm theo Cont No, FWD, Liner, Date hoặc Time…"><span id="status" class="status"></span><button id="export" class="secondary">Tải Excel kết quả</button><button id="reset" class="secondary">Xóa dữ liệu</button></div>
    <div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
    <div class="footer">Dữ liệu được xử lý cục bộ trên trình duyệt và không tự động tải lên máy chủ.</div>
  </section>
</main>
<script>
const REQUIRED=['Cont No','FWD','Liner','Date','Time'];
let rows=[], visible=[], sortKey='Date', sortAsc=true;
const $=id=>document.getElementById(id);
$('pick').onclick=e=>{e.stopPropagation();$('file').click()}; $('drop').onclick=()=>$('file').click();
$('file').onchange=e=>e.target.files[0]&&processFile(e.target.files[0]);
['dragenter','dragover'].forEach(n=>$('drop').addEventListener(n,e=>{e.preventDefault();$('drop').classList.add('drag')}));
['dragleave','drop'].forEach(n=>$('drop').addEventListener(n,e=>{e.preventDefault();$('drop').classList.remove('drag')}));
$('drop').addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)processFile(f)});
function fail(msg){$('error').textContent=msg;$('error').style.display='block'}
function normalizeHeader(v){return String(v??'').replace(/\s+/g,' ').trim().toLowerCase()}
function display(v,key){if(v==null)return ''; if(key==='Date'&&v instanceof Date)return new Intl.DateTimeFormat('en-GB').format(v); return String(v).trim()}
function excelTime(v){if(v instanceof Date)return v.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});if(typeof v==='number'){const s=Math.round((v%1)*86400),h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor((s%3600)/60)).padStart(2,'0');return `${h}:${m}`}return String(v??'').trim()}
async function processFile(file){
  $('error').style.display='none'; if(!file.name.toLowerCase().endsWith('.xlsx'))return fail('Vui lòng chọn đúng file có đuôi .xlsx.');
  try{
    const data=await file.arrayBuffer(); const wb=XLSX.read(data,{type:'array',cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]];
    const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true}); if(!matrix.length)throw new Error('Sheet đầu tiên không có dữ liệu.');
    const header=matrix[0].map(normalizeHeader); const indexes={}; REQUIRED.forEach(c=>indexes[c]=header.indexOf(normalizeHeader(c)));
    const missing=REQUIRED.filter(c=>indexes[c]<0); if(missing.length)throw new Error('Thiếu cột bắt buộc: '+missing.join(', '));
    const original=matrix.slice(1).filter(r=>r.some(v=>String(v??'').trim()!=='')); const seen=new Set(); let dup=0;
    rows=[]; original.forEach(r=>{const item={};REQUIRED.forEach(c=>item[c]=c==='Time'?excelTime(r[indexes[c]]):display(r[indexes[c]],c));const key=REQUIRED.map(c=>String(item[c]).trim().toUpperCase()).join('\u001F');if(seen.has(key)){dup++}else{seen.add(key);rows.push(item)}});
    sortRows(); visible=[...rows]; $('mFile').textContent=file.name;$('mOriginal').textContent=original.length;$('mDup').textContent=dup;$('mFinal').textContent=rows.length;
    $('summary').style.display='grid';$('result').style.display='block';$('search').value='';buildHead();render();
  }catch(err){fail('Không thể xử lý file: '+err.message)}
}
function sortRows(){rows.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];if(sortKey==='Date'){x=Date.parse(x)||0;y=Date.parse(y)||0}return (x>y?1:x<y?-1:0)*(sortAsc?1:-1)})}
function buildHead(){$('head').innerHTML='';REQUIRED.forEach(c=>{const th=document.createElement('th');th.innerHTML=c+`<span class="arrow">${sortKey===c?(sortAsc?'▲':'▼'):'↕'}</span>`;th.onclick=()=>{if(sortKey===c)sortAsc=!sortAsc;else{sortKey=c;sortAsc=true}sortRows();filter();buildHead()};$('head').appendChild(th)})}
function render(){$('body').innerHTML='';const frag=document.createDocumentFragment();visible.forEach(r=>{const tr=document.createElement('tr');REQUIRED.forEach(c=>{const td=document.createElement('td');td.textContent=r[c];tr.appendChild(td)});frag.appendChild(tr)});$('body').appendChild(frag);$('status').textContent=`Hiển thị ${visible.length} dòng`}
function filter(){const q=$('search').value.trim().toLowerCase();visible=rows.filter(r=>REQUIRED.some(c=>String(r[c]).toLowerCase().includes(q)));render()}
$('search').oninput=filter;
$('reset').onclick=()=>{rows=[];visible=[];$('file').value='';$('summary').style.display='none';$('result').style.display='none';$('error').style.display='none'};
$('export').onclick=()=>{const ws=XLSX.utils.json_to_sheet(visible,{header:REQUIRED});ws['!cols']=[{wch:18},{wch:12},{wch:12},{wch:14},{wch:10}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Processed');XLSX.writeFile(wb,'processed_container_data.xlsx')};
</script>
</body></html>
